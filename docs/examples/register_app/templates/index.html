<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><main><header><h1>Register your YubiKey</h1><p>Use the account from Tutorial 1. Complete the browser PIN and touch prompts.</p></header>
<div class="activity" role="status" aria-live="polite"><p id="status">Ready.</p><pre id="commands"></pre><pre id="result"></pre></div>

<button >Register YubiKey</button></form></section>
</main></body></html>
